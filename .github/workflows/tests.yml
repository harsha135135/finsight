name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: finsight
          POSTGRES_PASSWORD: finsight
          POSTGRES_DB: finsight_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finsight -d finsight_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      FINSIGHT_TEST_DATABASE_URL: postgresql://finsight:finsight@127.0.0.1:5432/finsight_test
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.1
      - run: uv sync --locked --extra app
      # Offline: no paid API calls, no GPU; tests needing local v1 artifacts skip themselves.
      - run: uv run pytest -q
        env:
          FINSIGHT_REQUIRE_POSTGRES: "1"
      # Mandatory offline replay of the FY2025 demo job from the committed bundle. Any HTTP(S) request outside the
      # bundle would go to a dead proxy and fail; the replay must reproduce the original outcome and fail closed.
      - name: Offline replay (no network)
        run: uv run pytest -q tests/finsight/test_replay.py
        env:
          FINSIGHT_REQUIRE_POSTGRES: "1"
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
      # Fresh-clone reproducibility: artifact hashes, and scores regenerated from committed predictions.
      - name: Verify experiment records
        run: uv run modelforge record verify --all

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t finsight:ci .
      - run: docker run --rm finsight:ci python -c "import finsight.api.app, finsight.worker, finsight.watchdog, finsight.supervisor"
