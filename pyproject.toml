[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight"
version = "0.1.0"
description = "FinSight: autonomous financial research with traceable answers, plus ModelForge for reproducible fine-tuning and evaluation"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Harshavardhan M" }]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
# Research application runtime (Postgres, LangGraph, Claude, API).
app = [
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langchain-core>=1.7.6",
    "langchain-anthropic>=1.7.10",
    "psycopg[binary]>=3.3.8",
    "psycopg-pool>=3.2",
]

[project.scripts]
finsight = "finsight.cli:main"
modelforge = "modelforge.cli:main"

[dependency-groups]
dev = ["pytest>=9.2"]

[tool.setuptools.packages.find]
include = ["finsight*", "modelforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: needs FINSIGHT_TEST_DATABASE_URL",
    "network: touches the network",
]
