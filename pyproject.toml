[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight"
version = "0.1.0"
description = "FinSight: autonomous financial research with traceable answers, plus ModelForge for reproducible fine-tuning and evaluation"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Harshavardhan M" }]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
# Research application runtime (Postgres, LangGraph, Claude, API).
app = [
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langchain-core>=1.7.6",
    "langchain-anthropic>=1.7.10",
    "psycopg[binary]>=3.3.8",
    "psycopg-pool>=3.2",
    "pypdfium2>=4.30",
]

# Fine-tuning and serving on the Linux/WSL2 GPU machine only. Training and serving share
# one environment so the tokenizer, chat template and torch build are identical.
gpu = [
    "torch==2.14.0; sys_platform == 'linux'",
    "transformers>=5.16.1,<5.21; sys_platform == 'linux'",
    "peft>=0.21.2; sys_platform == 'linux'",
    "trl>=1.17.1; sys_platform == 'linux'",
    "bitsandbytes>=0.50.2; sys_platform == 'linux'",
    "accelerate>=1.15.0; sys_platform == 'linux'",
    "vllm==0.33.0; sys_platform == 'linux'",
    "nvidia-ml-py>=13.615.71; sys_platform == 'linux'",
]

[project.scripts]
finsight = "finsight.cli:main"
modelforge = "modelforge.cli:main"

[dependency-groups]
dev = ["pytest>=9.2"]

[tool.setuptools.packages.find]
include = ["finsight*", "modelforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: needs FINSIGHT_TEST_DATABASE_URL",
    "network: touches the network",
]

[tool.uv]
# The Mac runs the app; the WSL2 GPU box runs training/serving. vLLM pins an older
# FastAPI, so the two extras are installed in separate environments.
conflicts = [[{ extra = "app" }, { extra = "gpu" }]]
# uv-managed CPython on every machine: same build, and it ships the headers Triton needs to
# compile its runtime helper (Ubuntu's system Python lacks Python.h without python3.12-dev).
python-preference = "only-managed"
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
